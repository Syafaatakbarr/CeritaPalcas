name: Convert activity HEIC photos to JPG

on:
  push:
    branches: [main]
    paths:
      - "assets/activities/mt-prau/**"
      - ".github/workflows/convert-heic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HEIC decoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif

      - name: Convert full-resolution HEIC photos to JPG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pillow_heif import register_heif_opener

          register_heif_opener()
          folder = Path("assets/activities/mt-prau")
          converted = []
          for source in sorted(list(folder.glob("*.HEIC")) + list(folder.glob("*.heic"))):
              target = source.with_suffix(".jpg")
              with Image.open(source) as image:
                  image = image.convert("RGB")
                  print(f"Converting {source.name}: {image.width}x{image.height}")
                  image.save(target, "JPEG", quality=92, optimize=True, progressive=True)
              print(f"Created {target.name}: {target.stat().st_size} bytes")
              converted.append(target)

          if not converted:
              raise SystemExit("No HEIC files found to convert")
          Path("/tmp/converted-photos.txt").write_text(
              "".join(f"{path}\n" for path in converted)
          )
          PY

      - name: Commit converted photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r file; do
            git add -- "$file"
          done < /tmp/converted-photos.txt
          git commit -m "Reconvert Prau photos at full resolution"
          git push
